# E-LAYER ANALYZER - compilazione e installatori per Windows (64 bit, 32 bit, ARM64), Linux (x64, ARM64, ARM 32 bit/armv7l, Alpine; pacchetti
# .deb, .rpm, Arch, Slackware, AppImage), FreeBSD (sperimentale),
# Raspberry Pi e Mac (Apple Silicon e Intel: .dmg e .app in zip).
# A ogni push sul ramo main: solo compilazione di controllo su Linux (i minuti Mac costano 10 volte, Windows 2 volte).
# Con un push sul ramo release (o un tag vX.Y.Z, o avviandolo a mano): installatori per Windows, Linux e Mac;
# con il ramo release o il tag crea anche la Release vX.Y.Z (versione letta dal file VERSION).
name: build

on:
  push:
    branches: [ main, release ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: x86
          - rid: win-arm64    # Windows su ARM (PC con Snapdragon)
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Elenco dei file distribuiti (data/manifest.txt, per il controllo dei file mancanti)
        shell: bash
        run: git ls-files data doc LEGGIMI.txt | grep -v '^data/manifest.txt$' > data/manifest.txt && wc -l data/manifest.txt
      - name: Compila
        run: dotnet publish E-LAYER-ANALYZER.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ env.VER }} -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Installatore (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=${{ env.VER }}" "/DSourceDir=..\publish\${{ matrix.rid }}" "/DArch=${{ matrix.arch }}" installer\E-LAYER-ANALYZER.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip portatile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\${{ matrix.rid }}\* -DestinationPath dist\E-LAYER-ANALYZER-${{ env.VER }}-win-${{ matrix.arch }}-portatile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Elenco dei file distribuiti (data/manifest.txt, per il controllo dei file mancanti)
        shell: bash
        run: git ls-files data doc LEGGIMI.txt | grep -v '^data/manifest.txt$' > data/manifest.txt && wc -l data/manifest.txt
      - name: Compila
        run: |
          set -o pipefail
          dotnet publish E-LAYER-ANALYZER.csproj -c Release -r linux-x64 --self-contained true -p:Version=$VER -p:DebugType=none -o publish/linux-x64 2>&1 | tee build.log
      - name: Registro della compilazione sul ramo ci-log
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p cilog && cp build.log cilog/ 2>/dev/null || echo "nessun registro" > cilog/build.log
          grep -E "error|warning CS" build.log | sort -u > cilog/errori.txt || true
          cd cilog
          git init -q -b ci-log
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "registro ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-log
      - name: Compila per Linux ARM64 e ARM 32 bit (Raspberry Pi)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          for R in linux-arm64 linux-arm; do
            dotnet publish E-LAYER-ANALYZER.csproj -c Release -r $R --self-contained true -p:Version=$VER -p:DebugType=none -o publish/$R 2>&1 | tail -3
            file publish/$R/E-LAYER-ANALYZER | tee -a build.log
          done
      - name: Pacchetti portatili (.tar.gz) e .deb
        run: |
          mkdir -p dist
          for R in linux-x64 linux-arm64 linux-arm; do
            [ -d publish/$R ] || continue
            rm -rf pkg && mkdir -p pkg
            cp -R publish/$R pkg/E-LAYER-ANALYZER
            cp installer/linux-install.sh pkg/E-LAYER-ANALYZER/installa.sh
            cp src/Assets/ela-256.png pkg/E-LAYER-ANALYZER/ela.png
            chmod +x pkg/E-LAYER-ANALYZER/installa.sh pkg/E-LAYER-ANALYZER/E-LAYER-ANALYZER
            tar -C pkg -czf dist/E-LAYER-ANALYZER-$VER-$R-portatile.tar.gz E-LAYER-ANALYZER
            # stesso programma con il nome dell'architettura, per le altre schede ARM a 32 bit (armv7l)
            [ "$R" = linux-arm ] && cp dist/E-LAYER-ANALYZER-$VER-linux-arm-portatile.tar.gz dist/E-LAYER-ANALYZER-$VER-linux-armv7l-portatile.tar.gz
          done
          # pacchetti di sistema e AppImage (installer/make-*.sh): .deb per PC (amd64) e Raspberry Pi OS 64 bit (arm64) e 32 bit (armhf),
          # .rpm (Fedora, openSUSE), Arch (.pkg.tar.zst), Slackware (.txz), AppImage x86_64. Il programma va in /opt/e-layer-analyzer
          # e al primo avvio si copia in ~/E-LAYER-ANALYZER, perche' la cartella data deve stare accanto al programma.
          for R in linux-x64 linux-arm64 linux-arm; do
            [ -d publish/$R ] && bash installer/make-deb.sh $R "$VER" publish/$R dist
          done
          if [ "${{ github.event_name }}" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            sudo apt-get install -y -qq rpm >/dev/null
            bash installer/make-rpm.sh linux-x64 "$VER" dist/e-layer-analyzer_${VER}_amd64.deb dist
            bash installer/make-txz.sh linux-x64 "$VER" dist/e-layer-analyzer_${VER}_amd64.deb dist
            bash installer/make-arch.sh linux-x64 "$VER" dist/e-layer-analyzer_${VER}_amd64.deb dist
            bash installer/make-appimage.sh linux-x64 "$VER" publish/linux-x64 dist
            if [ -d publish/linux-arm64 ]; then
              bash installer/make-rpm.sh linux-arm64 "$VER" dist/e-layer-analyzer_${VER}_arm64.deb dist
              bash installer/make-txz.sh linux-arm64 "$VER" dist/e-layer-analyzer_${VER}_arm64.deb dist
              bash installer/make-arch.sh linux-arm64 "$VER" dist/e-layer-analyzer_${VER}_arm64.deb dist
            fi
            [ -d publish/linux-arm ] && bash installer/make-rpm.sh linux-arm "$VER" dist/e-layer-analyzer_${VER}_armhf.deb dist
          fi
          ls -la dist
      - name: Fotografie delle linguette (schermo virtuale)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-dejavu-core fonts-noto-cjk fonts-noto-core >/dev/null
          cp -R publish/linux-x64 run
          timeout 200 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/aurora" --loc JN70CN --aurora IO70VJ JO59BC || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots" --loc JN70CN || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/chiaro" --loc JN70CN --colori chiaro || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/notte" --loc JN70CN --colori scuro || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/blu" --loc JN70CN --colori ip-blu || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/en" --loc JN70CN --lingua en || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/ja" --loc JN70CN --lingua ja --colori chiaro || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/ar" --loc JN70CN --lingua ar --colori nero || true
          timeout 520 xvfb-run -a -s "-screen 0 1600x1000x24" ./run/E-LAYER-ANALYZER --screenshot "$PWD/shots/hi" --loc JN70CN --lingua hi --colori pastello-verde || true
          ls -la shots shots/ya-ms || true
          cp run/data/errore_avvio.txt shots/ 2>/dev/null || true
          ls run/data/mappa run/data/swpc > shots/dati.txt 2>&1 || true
      - name: Pubblica le fotografie sul ramo ci-screenshots (avvio a mano, ramo ci-screenshots-prova)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          [ -d shots ] || exit 0
          B=ci-screenshots; [ "${{ github.event_name }}" = workflow_dispatch ] && B=ci-screenshots-prova
          cd shots
          git init -q -b $B
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "fotografie ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" $B
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  linux-extra:
    # su un processore ARM vero: AppImage aarch64 e Alpine (musl) aarch64; Alpine x86_64 e FreeBSD (sperimentale) sul runner x86
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - what: appimage-arm64
            os: ubuntu-24.04-arm
          - what: alpine-arm64
            os: ubuntu-24.04-arm
          - what: alpine-x64
            os: ubuntu-latest
          - what: freebsd
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Elenco dei file distribuiti (data/manifest.txt, per il controllo dei file mancanti)
        shell: bash
        run: git ls-files data doc LEGGIMI.txt | grep -v '^data/manifest.txt$' > data/manifest.txt && wc -l data/manifest.txt
      - name: Compila e impacchetta
        run: |
          set -eo pipefail
          mkdir -p dist
          portable() {   # $1 = cartella pubblicata, $2 = nome del pacchetto
            rm -rf pkg && mkdir -p pkg
            cp -R "$1" pkg/E-LAYER-ANALYZER
            cp installer/linux-install.sh pkg/E-LAYER-ANALYZER/installa.sh
            cp src/Assets/ela-256.png pkg/E-LAYER-ANALYZER/ela.png
            chmod +x pkg/E-LAYER-ANALYZER/installa.sh
            [ -f pkg/E-LAYER-ANALYZER/E-LAYER-ANALYZER ] && chmod +x pkg/E-LAYER-ANALYZER/E-LAYER-ANALYZER
            tar -C pkg -czf "dist/E-LAYER-ANALYZER-$VER-$2.tar.gz" E-LAYER-ANALYZER
          }
          case "${{ matrix.what }}" in
            appimage-arm64)
              dotnet publish E-LAYER-ANALYZER.csproj -c Release -r linux-arm64 --self-contained true -p:Version=$VER -p:DebugType=none -o publish/linux-arm64 2>&1 | tail -3
              bash installer/make-appimage.sh linux-arm64 "$VER" publish/linux-arm64 dist ;;
            alpine-arm64|alpine-x64)
              R=$([ "${{ matrix.what }}" = alpine-arm64 ] && echo linux-musl-arm64 || echo linux-musl-x64)
              dotnet publish E-LAYER-ANALYZER.csproj -c Release -r $R --self-contained true -p:Version=$VER -p:DebugType=none -o publish/$R 2>&1 | tail -3
              file publish/$R/E-LAYER-ANALYZER
              portable publish/$R "${{ matrix.what }}-portatile" ;;
            freebsd)
              # SPERIMENTALE, NON VERIFICATO (scelta dell'autore, 12/11/2026): Microsoft non distribuisce .NET per FreeBSD,
              # quindi si pubblica il programma "portabile" (senza runtime) da avviare con il .NET 8 della comunita'
              # (pkg install dotnet) e con le librerie native SkiaSharp e HarfBuzzSharp per FreeBSD, che Avalonia non fornisce.
              dotnet publish E-LAYER-ANALYZER.csproj -c Release --self-contained false -p:UseAppHost=false -p:Version=$VER -p:DebugType=none -o publish/freebsd 2>&1 | tail -3
              printf '%s\n' '#!/bin/sh' '# E-LAYER ANALYZER su FreeBSD (sperimentale, non verificato): serve .NET 8 (pkg install dotnet)' \
                'cd "$(dirname "$0")" && exec dotnet E-LAYER-ANALYZER.dll "$@"' > publish/freebsd/E-LAYER-ANALYZER
              chmod +x publish/freebsd/E-LAYER-ANALYZER
              printf '%s\n' "E-LAYER ANALYZER $VER per FreeBSD amd64 - PACCHETTO SPERIMENTALE, NON VERIFICATO" "" \
                "Microsoft non distribuisce .NET per FreeBSD e la grafica Avalonia non ha le librerie native per FreeBSD." \
                "Serve il .NET 8 della comunita': pkg install dotnet" \
                "Servono le librerie native di SkiaSharp e HarfBuzzSharp compilate per FreeBSD (libSkiaSharp.so, libHarfBuzzSharp.so)," \
                "da mettere accanto al programma: senza di loro il programma non parte." \
                "Avvio: ./E-LAYER-ANALYZER (script che esegue: dotnet E-LAYER-ANALYZER.dll)" > publish/freebsd/LEGGIMI-FREEBSD.txt
              portable publish/freebsd "freebsd-amd64-sperimentale" ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: extra-${{ matrix.what }}
          path: dist/*

  macos:
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Versione
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "VER=$V" >> $GITHUB_ENV
      - name: Elenco dei file distribuiti (data/manifest.txt, per il controllo dei file mancanti)
        shell: bash
        run: git ls-files data doc LEGGIMI.txt | grep -v '^data/manifest.txt$' > data/manifest.txt && wc -l data/manifest.txt
      - name: Compila
        run: dotnet publish E-LAYER-ANALYZER.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=$VER -p:DebugType=none -o publish/${{ matrix.rid }}
      - name: Pacchetto YA-MS.app e immagine disco
        run: |
          APP=pkg/E-LAYER-ANALYZER/E-LAYER-ANALYZER.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp -R publish/${{ matrix.rid }}/. "$APP/Contents/MacOS/"
          cp -R data "$APP/Contents/Resources/data"
          cp src/Assets/ela.icns "$APP/Contents/Resources/"
          sed "s/__VERSION__/$VER/g" installer/Info.plist > "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/E-LAYER-ANALYZER"
          codesign --force --deep -s - "$APP"
          cp "installer/macos-install.command" "pkg/E-LAYER-ANALYZER/Installa E-LAYER-ANALYZER.command"
          chmod +x "pkg/E-LAYER-ANALYZER/Installa E-LAYER-ANALYZER.command"
          cp LEGGIMI.txt pkg/E-LAYER-ANALYZER/
          hdiutil create -volname "E-LAYER ANALYZER" -srcfolder pkg/E-LAYER-ANALYZER -ov -format UDZO "dist/E-LAYER-ANALYZER-$VER-${{ matrix.rid }}.dmg"
          ditto -c -k --keepParent "$APP" "dist/E-LAYER-ANALYZER-$VER-${{ matrix.rid }}-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    needs: [ windows, linux, linux-extra, macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        run: echo "VER=$(tr -d ' \r\n' < VERSION)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: E-LAYER ANALYZER ${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body: |
            E-LAYER ANALYZER - analisi dei modi di propagazione dello strato E (E-sporadico, F.A.I., meteor scatter con YA-MS, aurora).
            A cura di Costantino IC8TEM.

            Novità della 0.5.0: METEOR SCATTER con YA-MS 1.8.15 (CALL3 da MMMonVHF ogni 12 ore, G7VRD ogni 30 minuti e strato JTDX; FT8 isolati controllati con PSKReporter MQTT; riquadri sopra la mappa del Traffico in diretta e Mercatore spostabile; pulsante «Memorizza» del locator; rimando a PSKReporter delle decodifiche MS via UDP; messaggi cifrati tra gli utenti di YA-MS), con la raccolta dati sempre unica in DATA COLLECTION; controllo degli aggiornamenti ogni 30 minuti; sei nuovi temi di colore presi da IP-TRX-CTRL (Chiaro, Notte, Nero, Blu, Viola, Verde; Blu, Viola e Verde sono anche i colori in più di YAEC). Dalla 0.4.18, mai pubblicata a parte: linguetta IMPOSTAZIONI, regole di smistamento per banda, fascia TEP ±15° (Cracknell), campo IGRF dell'anno del QSO nei banchi di prova e nei casi F.A.I. del 1987 e 1990, BENCHMARK AURORA corretto (prima calcolava con il dipolo), nuove distribuzioni.
            Novità della 0.4.18: nuova linguetta IMPOSTAZIONI (Generali: stazione, lingua, tema, carattere 85-140 %, continente, ora NTP, aggiornamenti, dati; Smistamento degli spot: tabella delle regole con i filtri di ciascun modo). Regole per banda: FT8/FT4 in 50 e 70 MHz all'E-sporadico (in 50 MHz solo dentro una nube, altrimenti meteor scatter), 70 MHz da 450 km, 40 MHz (8 m) entro il primo salto dello strato E (solo in diretta), Q65/JT65 in 144 MHz = EME salvo <ES>, aurora anche in 430-440 MHz, F.A.I. fino ai 144 MHz; fascia TEP ±15° di inclinazione (Cracknell); quadrati Es in 144 MHz con un salto in 50 MHz tra 450 e 500 km; modello IGRF aggiornato da solo e campo dell'anno del QSO nei banchi di prova; nuove distribuzioni: Windows ARM64, Alpine (musl) x64 e ARM64, .rpm, Arch, Slackware x86_64, AppImage x86_64 e aarch64, FreeBSD sperimentale.
            Novità della 0.4.17: METEOR SCATTER con YA-MS 1.8.14 (colonna unica accanto alla mappa con corrispondente, puntamento dell'antenna e legenda; monitor attivi della mappa di PSKReporter, FT8 lunghi e isolati, rimando a PSKReporter delle decodifiche MS via UDP); controllo degli aggiornamenti ogni 30 minuti.
            Novità della 0.4.16: un solo archivio CALL3 per tutto il programma (quello di YA-MS, regole di LIVETROPOVHF); spot di WSJT-X / JTDX / MSHV via UDP anche nell'archivio degli spot di E-LAYER (fonte WSJT-X UDP); METEOR SCATTER con YA-MS 1.8.10; in DATA COLLECTION anche PSKReporter MQTT, WSJT-X UDP e i comandi del CALL3; i filtri di YA-MS valgono solo per METEOR SCATTER.
            Novità della 0.4.15: METEOR SCATTER con YA-MS 1.8.9 (ricerche G7VRD ogni 6 ore, correzioni scritte in call3.txt).
            Novità della 0.4.14: METEOR SCATTER con YA-MS 1.8.8 (CALL3 con l'ultima fonte G7VRD come in LIVETROPOVHF).
            Novità della 0.4.13: METEOR SCATTER con YA-MS 1.8.7 (corrispondente con nominativo dal CALL3 con le regole di LIVETROPOVHF, traffico in diretta anche in Mercatore, barra rossa dell'orario di calcolo).
            Novità della 0.4.12: aggiornamenti automatici e silenziosi (il programma si aggiorna e si riavvia da solo; agg_automatici=0 in data/ela.ini per farsi chiedere); METEOR SCATTER con YA-MS 1.8.6 (traffico in diretta con tutte le bande).
            Novità della 0.4.11: linguetta METEOR SCATTER con YA-MS 1.8.5 (spot tra stazioni più vicine di 500 km scartati nella Raccolta dati).
            Novità della 0.4.10: linguetta METEOR SCATTER con YA-MS 1.8.4 (spot CW scartati, stazioni in ascolto in MSK144/FSK441/PSK2K/JTMS sulla mappa del traffico, 28 e 70 MHz nei filtri).
            Novità della 0.4.9: linguetta METEOR SCATTER con YA-MS 1.8.3 (casella "diagramma d'antenna" nel riquadro arancione, come l'angolo beta).
            Novità della 0.4.8: linguetta METEOR SCATTER con YA-MS 1.8.2 (lettera del lato Hot accanto a ogni valore della previsione, casella "diagramma d'antenna" senza riquadro).

            Novità della 0.4.7: nuovi pacchetti per Raspberry Pi OS a 32 bit (.deb armhf), Slackware ARM64 (.txz) e Linux armv7l (tar.gz);
            manuale d'uso di YA-MS in 36 lingue nella linguetta METEOR SCATTER; manuale e wiki aggiornati in 36 lingue.

            - Windows 64 bit: E-LAYER-ANALYZER-...-win-x64-setup.exe (installa in C:\E-LAYER-ANALYZER) oppure ...-win-x64-portatile.zip.
            - Windows 32 bit: ...-win-x86-setup.exe oppure ...-win-x86-portatile.zip. Windows su ARM (PC con Snapdragon): ...-win-arm64-setup.exe oppure ...-win-arm64-portatile.zip.
            - Debian, Ubuntu, Mint: e-layer-analyzer_..._amd64.deb (sudo apt install ./e-layer-analyzer_..._amd64.deb).
            - Fedora, openSUSE: e-layer-analyzer-....x86_64.rpm (o .aarch64.rpm, .armv7hl.rpm).
            - Arch, Manjaro, EndeavourOS, Arch Linux ARM: e-layer-analyzer-...-x86_64.pkg.tar.zst (o -aarch64), con sudo pacman -U.
