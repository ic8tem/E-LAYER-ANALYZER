            - Raspberry Pi OS 64 bit: e-layer-analyzer_..._arm64.deb oppure ...-linux-arm64-portatile.tar.gz; 32 bit: e-layer-analyzer_..._armhf.deb oppure ...-linux-arm-portatile.tar.gz.
