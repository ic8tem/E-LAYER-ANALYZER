            Novità della 0.6.3: nuova linguetta ABACO DEI SALTI, documento di sintesi esportabile in Word: quanti salti servono in 50 MHz da 500 a 12000 km, con passo 100 km, con la foEs di ogni salto e le fonti; doppio salto a salti uguali fino a circa 4700 km (per esempio verso il Kazakhstan) nei Precursori multi-salto (salti «2 =»), con la nube a un quarto della tratta come nel metodo ITU-R P.534-6; nuove fonti [74] Hao et al. 2025 (spostamento delle nubi dai rapporti FT8), [75] Matsushima et al. 2022 (Doppler HF e GPS-TEC in Giappone) e [76] ITU-R P.534-6. Corretta e dichiarata la wiki in turco, ucraino, afrikaans, arabo ed ebraico, che descriveva ancora le tre viste della mappa (prima della 0.6.0) senza i cerchi delle distanze di IK3XTV. In tutte le 35 lingue.
            Novità della 0.6.2: correzioni dichiarate delle traduzioni della 0.6.1, dopo la verifica di numeri, riferimenti, indirizzi e termini nelle 35 lingue: bengalese, indirizzo della fonte [3] che non funzionava (errore già presente prima della 0.6.0); hindi, «velocità mediana» scritta come «velocità media»; tedesco, «Median» reso ambiguo; tailandese e cinese, parola per «catene» diversa dal resto del documento; russo e ucraino, unità km e m/s e nome Whitehead come nel resto dei documenti; lettone, nome Whitehead; tagalog, «finestra» rimasta in inglese. Solo documenti; nessun cambio nei calcoli.
            Novità della 0.6.1: nuova fonte [73] (F. Egano IK3XTV, «E sporadico alle medie latitudini», Radio Rivista 2012) sullo spostamento delle nubi Es (40-100 m/s), a sostegno della finestra di 30 minuti delle catene; verifica sulle decodifiche dell'autore (velocità mediana 45 m/s, direzione soprattutto verso ovest). Solo documenti, in tutte le lingue; nessun cambio nei calcoli.
            Novità della 0.6.0: catene del multi-salto in 50 MHz con i salti corti alle estremità (SPORADIC-E, Precursori multi-salto), secondo le tre condizioni dell'autore: primo e ultimo salto corto (500-1200 km) con MUF intorno ai 50 MHz e salti centrali fino a 2200 km. Nubi forti dagli spot di tutto il mondo e dalle ionosonde GIRO; catene dal QTH (anche con l'estremità nello stesso continente, per esempio in Kazakhstan), corridoi fra due nubi qualunque in ogni direzione (per esempio Caraibi - Penisola Iberica, Europa - Africa occidentale; TEP escluso) e «cerca la nube», solo se arrivano dove ci sono stazioni (non in mare aperto); proiezione del proprio segnale in 50 MHz sulle nubi stimate da tutte le bande 28-144 MHz (punti rosa sulla mappa REAL-TIME); avviso in alto (e facoltativamente una finestra) per le ALLERTE che riguardano la propria stazione; verifica delle catene nel BENCHMARK 50 MHz con gli spot CSV esportati, i log ADIF e le decodifiche ALL.TXT (JTDX, WSJT-X) di altre stazioni. Ringraziamenti per l'E-sporadico in 50 MHz: Johan IW2DNI e Fabio IZ7NLJ. Nuove fonti [71] DF5AI (UKSMG 1999) e [72] EI7GL (UN7MBH, 70 MHz).
            Novità della 0.5.3: modalità compatta corretta a 1366x768: in IONOSONDE e NUBI Es NEL TEMPO il grafico sparisce e la MUF dell'E-sporadico, le celle e la sintesi tornano leggibili (nella 0.5.2 il grafico usciva vuoto e la MUF si sovrapponeva alla dicitura GIRO); nella riga della stazione le scritte Nominativo, Locator e Quota passano nei fumetti dei campi.
            Novità della 0.5.2: due nuove sottolinguette di SPORADIC-E. IONOSONDE: foEs, foF2 e MUF(D) in diretta dalle ionosonde GIRO ogni 15 minuti (dati CC BY-NC-SA 4.0, solo uso non commerciale), grafico di 24 ore, MUF dell'E-sporadico a 1000-2400 km con le bande che si aprono e confronto con la foEs ricavata dagli spot. NUBI Es NEL TEMPO: le nubi Es passo per passo (5-15 minuti, celle di 1-4 gradi) con il metodo di Chartier, Hanley ed Emmons 2022, da spot della sessione, log ADIF o spot CSV, con l'esportazione degli spot della sessione. Nuove fonti [68] GIRO, [69] MUF Muncher di DM6AX, [70] deposito sporadice di Chartier. Modalità compatta per i notebook da 13-15 pollici (IMPOSTAZIONI > Aspetto: automatica sotto 850 pixel di altezza, sempre o mai) e apertura a tutto schermo quando lo schermo è più piccolo della finestra. METEOR SCATTER con YA-MS 1.8.20: modalità compatta, pausa di 30 minuti dopo un errore 429 di PSKReporter e una sola copia che interroga il servizio, sottolinguetta Crediti.
            Novità della 0.5.1: METEOR SCATTER con YA-MS 1.8.19 (fascia degli orizzonti di previsione sopra le linguette, linea del tempo nel Calcolo previsionale, lampeggio solo quando un corrispondente risponde, catalogo IAU MDC nei pacchetti); pacchetti per Windows 7 SP1, 8 e 8.1 (-win7-x64-, -win7-x86-, .NET 6), mentre gli altri pacchetti Windows richiedono Windows 10 o 11 e l'installatore lo dice subito; nuova fonte [67] (Chartier, Hanley, Emmons 2022, E-sporadico a 162 MHz).
            Novità della 0.5.0: METEOR SCATTER con YA-MS 1.8.15 (CALL3 da MMMonVHF ogni 12 ore, G7VRD ogni 30 minuti e strato JTDX; FT8 isolati controllati con PSKReporter MQTT; riquadri sopra la mappa del Traffico in diretta e Mercatore spostabile; pulsante «Memorizza» del locator; rimando a PSKReporter delle decodifiche MS via UDP; messaggi cifrati tra gli utenti di YA-MS), con la raccolta dati sempre unica in DATA COLLECTION; controllo degli aggiornamenti ogni 30 minuti; sei nuovi temi di colore presi da IP-TRX-CTRL (Chiaro, Notte, Nero, Blu, Viola, Verde; Blu, Viola e Verde sono anche i colori in più di YAEC). Dalla 0.4.18, mai pubblicata a parte: linguetta IMPOSTAZIONI, regole di smistamento per banda, fascia TEP ±15° (Cracknell), campo IGRF dell'anno del QSO nei banchi di prova e nei casi F.A.I. del 1987 e 1990, BENCHMARK AURORA corretto (prima calcolava con il dipolo), nuove distribuzioni.
            Novità della 0.4.18: nuova linguetta IMPOSTAZIONI (Generali: stazione, lingua, tema, carattere 85-140 %, continente, ora NTP, aggiornamenti, dati; Smistamento degli spot: tabella delle regole con i filtri di ciascun modo). Regole per banda: FT8/FT4 in 50 e 70 MHz all'E-sporadico (in 50 MHz solo dentro una nube, altrimenti meteor scatter), 70 MHz da 450 km, 40 MHz (8 m) entro il primo salto dello strato E (solo in diretta), Q65/JT65 in 144 MHz = EME salvo <ES>, aurora anche in 430-440 MHz, F.A.I. fino ai 144 MHz; fascia TEP ±15° di inclinazione (Cracknell); quadrati Es in 144 MHz con un salto in 50 MHz tra 450 e 500 km; modello IGRF aggiornato da solo e campo dell'anno del QSO nei banchi di prova; nuove distribuzioni: Windows ARM64, Alpine (musl) x64 e ARM64, .rpm, Arch, Slackware x86_64, AppImage x86_64 e aarch64, FreeBSD sperimentale.
            Novità della 0.4.17: METEOR SCATTER con YA-MS 1.8.14 (colonna unica accanto alla mappa con corrispondente, puntamento dell'antenna e legenda; monitor attivi della mappa di PSKReporter, FT8 lunghi e isolati, rimando a PSKReporter delle decodifiche MS via UDP); controllo degli aggiornamenti ogni 30 minuti.
            Novità della 0.4.16: un solo archivio CALL3 per tutto il programma (quello di YA-MS, regole di LIVETROPOVHF); spot di WSJT-X / JTDX / MSHV via UDP anche nell'archivio degli spot di E-LAYER (fonte WSJT-X UDP); METEOR SCATTER con YA-MS 1.8.10; in DATA COLLECTION anche PSKReporter MQTT, WSJT-X UDP e i comandi del CALL3; i filtri di YA-MS valgono solo per METEOR SCATTER.
            Novità della 0.4.15: METEOR SCATTER con YA-MS 1.8.9 (ricerche G7VRD ogni 6 ore, correzioni scritte in call3.txt).
            Novità della 0.4.14: METEOR SCATTER con YA-MS 1.8.8 (CALL3 con l'ultima fonte G7VRD come in LIVETROPOVHF).
            Novità della 0.4.13: METEOR SCATTER con YA-MS 1.8.7 (corrispondente con nominativo dal CALL3 con le regole di LIVETROPOVHF, traffico in diretta anche in Mercatore, barra rossa dell'orario di calcolo).
            Novità della 0.4.12: aggiornamenti automatici e silenziosi (il programma si aggiorna e si riavvia da solo; agg_automatici=0 in data/ela.ini per farsi chiedere); METEOR SCATTER con YA-MS 1.8.6 (traffico in diretta con tutte le bande).
            Novità della 0.4.11: linguetta METEOR SCATTER con YA-MS 1.8.5 (spot tra stazioni più vicine di 500 km scartati nella Raccolta dati).
            Novità della 0.4.10: linguetta METEOR SCATTER con YA-MS 1.8.4 (spot CW scartati, stazioni in ascolto in MSK144/FSK441/PSK2K/JTMS sulla mappa del traffico, 28 e 70 MHz nei filtri).
            Novità della 0.4.9: linguetta METEOR SCATTER con YA-MS 1.8.3 (casella "diagramma d'antenna" nel riquadro arancione, come l'angolo beta).
            Novità della 0.4.8: linguetta METEOR SCATTER con YA-MS 1.8.2 (lettera del lato Hot accanto a ogni valore della previsione, casella "diagramma d'antenna" senza riquadro).

            Novità della 0.4.7: nuovi pacchetti per Raspberry Pi OS a 32 bit (.deb armhf), Slackware ARM64 (.txz) e Linux armv7l (tar.gz);
            manuale d'uso di YA-MS in 36 lingue nella linguetta METEOR SCATTER; manuale e wiki aggiornati in 36 lingue.

            - Windows 64 bit: E-LAYER-ANALYZER-...-win-x64-setup.exe (installa in C:\E-LAYER-ANALYZER) oppure ...-win-x64-portatile.zip.
            - Windows 32 bit: ...-win-x86-setup.exe oppure ...-win-x86-portatile.zip. Windows su ARM (PC con Snapdragon): ...-win-arm64-setup.exe oppure ...-win-arm64-portatile.zip. Questi pacchetti richiedono Windows 10 o 11.
            - Windows 7 SP1, 8 e 8.1 (.NET 6): ...-win7-x64-setup.exe, ...-win7-x86-setup.exe oppure gli zip ...-win7-x64-portatile.zip, ...-win7-x86-portatile.zip.
            - Debian, Ubuntu, Mint: e-layer-analyzer_..._amd64.deb (sudo apt install ./e-layer-analyzer_..._amd64.deb).
            - Fedora, openSUSE: e-layer-analyzer-....x86_64.rpm (o .aarch64.rpm, .armv7hl.rpm).
            - Arch, Manjaro, EndeavourOS, Arch Linux ARM: e-layer-analyzer-...-x86_64.pkg.tar.zst (o -aarch64), con sudo pacman -U.
            - Slackware: da root installpkg e-layer-analyzer-...-x86_64-1_ic8tem.txz (o -aarch64- per Slackware ARM64 sul Raspberry Pi).
            - Qualsiasi Linux: E-LAYER-ANALYZER-...-x86_64.AppImage (o -aarch64.AppImage), oppure ...-linux-x64-portatile.tar.gz.
            - Alpine Linux e altri Linux con musl: ...-alpine-x64-portatile.tar.gz o ...-alpine-arm64-portatile.tar.gz (serve apk add icu-libs fontconfig).
            - Raspberry Pi OS 64 bit: e-layer-analyzer_..._arm64.deb oppure ...-linux-arm64-portatile.tar.gz; 32 bit: e-layer-analyzer_..._armhf.deb oppure ...-linux-arm-portatile.tar.gz.
            - Altri Linux ARM (schede armv7l): ...-linux-armv7l-portatile.tar.gz.
            - Portatili Linux: estrarre e avviare ./E-LAYER-ANALYZER, oppure ./installa.sh per installare in ~/E-LAYER-ANALYZER con l'icona nel menu.
            - Con i pacchetti di sistema (.deb, .rpm, Arch, Slackware) e con l'AppImage il programma si avvia dal menu e al primo avvio si copia in ~/E-LAYER-ANALYZER, con la cartella data accanto.
            - FreeBSD amd64: ...-freebsd-amd64-sperimentale.tar.gz, PACCHETTO SPERIMENTALE E NON VERIFICATO: serve il .NET 8 della comunità (pkg install dotnet) e servono le librerie SkiaSharp e HarfBuzzSharp per FreeBSD (vedi LEGGIMI-FREEBSD.txt).
            - Non disponibili: Linux i686 (PC a 32 bit) e OpenBSD, perché .NET non esiste per quei sistemi.
            - Aggiornamento automatico: con l'installatore o lo zip di Windows, l'app del Mac, i portatili tar.gz e l'AppImage il programma si aggiorna da solo dalle Release. Con i pacchetti di sistema (.deb, .rpm, Arch, Slackware) no: si aggiorna installando il pacchetto nuovo.
            - Nessun dato in AppData: tutto sta nella cartella data accanto al programma.
            - Mac: E-LAYER-ANALYZER-...-osx-arm64.dmg (Apple Silicon M1-M4) o ...-osx-x64.dmg (Intel); aprire il .dmg, clic destro su "Installa E-LAYER-ANALYZER.command" > Apri. In alternativa ...-osx-arm64-app.zip / ...-osx-x64-app.zip con la sola applicazione.
